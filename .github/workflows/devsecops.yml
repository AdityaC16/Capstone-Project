# DevSecOps pipeline: Build -> Test -> SAST -> SCA -> DAST -> Deploy gate
# Blocking policy is documented in docs/devsecops.md - keep the two in sync.
name: DevSecOps Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  APP_DIR: api/python

jobs:
  # 1 + 2. Build and unit tests
  build-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/python/requirements*.txt
      - name: Install dependencies
        run: pip install -r $APP_DIR/requirements-dev.txt
      - name: Build (byte-compile the app)
        run: python -m compileall -q $APP_DIR/app
      - name: Unit tests
        run: |
          mkdir -p reports
          pytest -q --junitxml=reports/junit.xml --cov=app --cov-report=term --cov-report=xml:reports/coverage.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: reports/

  # 3. SAST - Bandit (works on private and public repos)
  sast-bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit==1.9.4
      - name: Bandit full report (all severities, never fails)
        run: |
          mkdir -p reports
          bandit -r $APP_DIR/app -f json -o reports/bandit.json --exit-zero
          bandit -r $APP_DIR/app -f txt -o reports/bandit.txt --exit-zero
          cat reports/bandit.txt
      - name: Bandit gate (fails on MEDIUM+ severity, e.g. SQL injection B608)
        run: bandit -r $APP_DIR/app --severity-level medium --confidence-level medium
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sast-bandit
          path: reports/

  # 3b. SAST - CodeQL. Only runs on PUBLIC repos: private repos need GitHub
  # Advanced Security / Code Security, otherwise this job errors.
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4

  # 4. SCA - pip-audit on third-party dependencies
  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit==2.10.1
      - name: pip-audit report (never fails)
        run: |
          mkdir -p reports
          pip-audit -r $APP_DIR/requirements.txt --desc -f json -o reports/pip-audit.json || true
          pip-audit -r $APP_DIR/requirements.txt --desc -f markdown -o reports/pip-audit.md || true
          cat reports/pip-audit.md
      - name: pip-audit gate (fails on ANY known vulnerability)
        run: pip-audit -r $APP_DIR/requirements.txt
      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sca-pip-audit
          path: reports/

  # 5. DAST - OWASP ZAP API scan against the RUNNING API, driven by FastAPI's
  # OpenAPI spec so it actually exercises POST /calculate (a baseline scan only spiders GET pages).
  dast:
    name: DAST - OWASP ZAP API scan
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Start API
        working-directory: ${{ env.APP_DIR }}
        run: |
          pip install -r requirements.txt
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/api.log
          exit 1
      - name: ZAP API scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://127.0.0.1:8000/openapi.json
          format: openapi
          # Report-only for Sprint 1. Agree thresholds, then add a rules file
          # (rules_file_name) and set fail_action: true. See docs/devsecops.md.
          fail_action: false
          allow_issue_writing: false
          artifact_name: dast-zap
      - name: API log
        if: always()
        run: cat /tmp/api.log

  # 6. Deployment gate - only reached when every blocking check passes.
  deploy-gate:
    name: Deployment gate
    runs-on: ubuntu-latest
    needs: [build-test, sast-bandit, sca, dast]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - run: echo "All checks passed. Deployment steps (Azure) go here once a protected environment and secrets are configured."
